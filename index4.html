<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class with button and hover</title>
    <style>
        .btn{
            background-color: blue;
            color: white;
            padding: 5px 25px;
            border: none;
            border-radius: 8px;
        }
        .btn:hover{
            background-color: red;
        }
    </style>
</head>
<body>
    <button class="btn">click on me</button>
</body>
</html>
