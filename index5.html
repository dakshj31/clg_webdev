<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student profile card</title>
    <style>
        .card{
            width: 300px;
            padding: 20px;
            margin: 30px;
            border: 2px solid black;
            border-radius: 10px;
            text-align: center;

        }
        .title{
            color: blue;
        }
        .info{
            font-size: 18px;
        }
        .btn{
            background-color: green;
            color: white;
            padding: 10px 20px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="card">
    <h2 class="title">Daksh</h2>
    <p class="info">MCA Student</p>
    <p class="info">Roll no: 23</p>
    <button class="btn">View Profile</button>
    </div>
</body>
</html>
